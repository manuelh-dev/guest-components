syntax = "proto3";

package api;

message UnsealSecretInput {
    // The input `secret`` is in the following format
    // `sealed`.`JWS header`.`JWS body (secret content)`.`signature`
    bytes secret = 1;
}

message UnsealSecretOutput {
    bytes plaintext = 1;
}

message GetResourceRequest {
    string ResourcePath = 1;
}

message GetResourceResponse {
    bytes Resource = 1;
}

message SecureMountRequest {
    string volume_type = 1;
    map<string, string> options = 2;
    repeated string flags = 3;
    string mount_point = 4;
}

message SecureMountResponse {}

message ActivateVolumeRequest {
    // Guest block device in MAJ:MIN form.
    string device_id = 1;

    oneof configuration_source {
        // Immutable secure-volume manifest stored in Trustee/KBS.
        string manifest_uri = 2;
    }
}

message ActivateVolumeResponse {
    // Opaque handle used to release the activation.
    string activation_id = 1;

    // Activated plaintext block device inside the guest.
    string device_path = 2;
}

message DeactivateVolumeRequest {
    string activation_id = 1;
}

message DeactivateVolumeResponse {}

message ImagePullRequest {
    string image_url = 1;
    string bundle_path = 2;
}

message ImagePullResponse {
    string manifest_digest = 1;
}

service SealedSecretService {
    rpc UnsealSecret(UnsealSecretInput) returns (UnsealSecretOutput) {};
}

service GetResourceService {
    rpc GetResource(GetResourceRequest) returns (GetResourceResponse) {};
}

service SecureMountService {
    rpc SecureMount(SecureMountRequest) returns (SecureMountResponse) {};
}

service SecureVolumeService {
    rpc ActivateVolume(ActivateVolumeRequest) returns (ActivateVolumeResponse) {};
    rpc DeactivateVolume(DeactivateVolumeRequest) returns (DeactivateVolumeResponse) {};
}

service ImagePullService {
    rpc PullImage(ImagePullRequest) returns (ImagePullResponse) {};
}
